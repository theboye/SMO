version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: shortqr-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: shortqr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: shortqr-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: