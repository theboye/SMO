<!DOCTYPE html>
<html>
<head>
    <title>Internal Saturation Report</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 40px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Internal Bottleneck: Loop Lag vs CPU/RAM</h2>
        <canvas id="healthChart"></canvas>
    </div>
    <script>
        fetch('/testers/telemetry-data.json')
            .then(r => r.json())
            .then(data => {
                new Chart(document.getElementById('healthChart'), {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.time),
                        datasets: [
                            { label: 'Event Loop Delay (ms)', data: data.map(d => d.loopDelay), borderColor: '#f87171', yAxisID: 'y' },
                            { label: 'Heap Memory (MB)', data: data.map(d => d.heapMB), borderColor: '#34d399', yAxisID: 'y1' }
                        ]
                    },
                    options: { scales: { y: { title: { display: true, text: 'ms' } }, y1: { position: 'right' } } }
                });
            });
    </script>
</body>
</html>
